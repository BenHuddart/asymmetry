<text x="660.0" y="776.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Laboratory ratio fit</text>
<text x="660.0" y="808.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Original observations</text>
