<text x="195.0" y="67.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">NeXus · PSI BIN/MDU · ROOT</text>
<rect x="20" y="115" width="350" height="70" rx="8" fill="#edf4fa" stroke="#35566c" stroke-width="1.5"/>
<text x="195.0" y="138.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">Select run, period, groups</text>
<text x="195.0" y="162.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">and exclusions; resolve settings</text>
<rect x="20" y="220" width="350" height="70" rx="8" fill="#edf4fa" stroke="#35566c" stroke-width="1.5"/>
<text x="195.0" y="243.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">Apply enabled detector</text>
<text x="195.0" y="267.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">deadtime correction</text>
