<rect x="435" y="220" width="245" height="70" rx="8" fill="#f3eef9" stroke="#35566c" stroke-width="1.5"/>
<text x="557.5" y="243.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#163449">Detector calibration</text>
<text x="557.5" y="267.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#163449">and exposure</text>
<rect x="435" y="440" width="245" height="70" rx="8" fill="#f3eef9" stroke="#35566c" stroke-width="1.5"/>
