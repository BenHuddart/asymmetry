<text x="450.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Resolve timing, good bounds, calibration</text>
<text x="450.0" y="232.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">and correction / reference settings</text>
<rect x="150" y="290" width="600" height="80" rx="9" fill="#edf4fa" stroke="#35566c" stroke-width="1.5"/>
<text x="450.0" y="330.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Enabled detector deadtime correction</text>
<rect x="150" y="405" width="600" height="110" rx="9" fill="#edf4fa" stroke="#35566c" stroke-width="1.5"/>
<text x="450.0" y="428.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Align whole bins; sum selected groups</text>
<text x="450.0" y="460.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Retain common support and counting noise</text>
<text x="450.0" y="492.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Apply enabled group background</text>
