<text x="195.0" y="341.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">Align whole bins; sum groups</text>
<text x="195.0" y="365.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">Resolve common support</text>
<text x="195.0" y="389.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">and aligned good window</text>
