<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1710" viewBox="0 0 900 1710" role="img" aria-labelledby="title description">
<title id="title">Count reduction and alternative transformed observations</title>
<desc id="description">Selected acquired counts branch into grouped lifetime signals for FFT and MaxEnt, and F/B ratios for laboratory fitting, vector rotation, or scalar FIR display. Native-window preparation branches into count-integral or explicit time-mean scans, original-observable fits and derivative display. Full-count fits use separate preparation. No filtered scalar curve feeds fitting.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#35566c"/></marker></defs>
