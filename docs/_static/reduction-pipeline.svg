<text x="240.0" y="808.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">1/σ fractional level</text>
<text x="240.0" y="840.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Optional 1/σ mean removal</text>
<text x="240.0" y="872.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Window → FFT → scale</text>
<text x="240.0" y="904.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Separate group phases</text>
