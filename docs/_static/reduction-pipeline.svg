<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" role="img" aria-labelledby="title description">
<title id="title">Standard count-based forward/backward reduction</title>
<desc id="description">For one selected run and period, acquired histograms undergo optional detector deadtime correction, whole-bin alignment and group summation, optional group background correction, count binning, and asymmetry formation. Dashed arrows supply settings, calibration, references, and current corrected counts. A run-level integral-observable branch supports no background or a constant subtraction, with its own window, estimator, and balances.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#35566c"/></marker></defs>
<rect width="700" height="900" fill="white"/>
<g fill="none" stroke="#35566c" stroke-width="2" marker-end="url(#arrow)">
<path d="M 195 90 V 112"/>
<path d="M 195 185 V 217"/>
<path d="M 195 290 V 322"/>
<path d="M 195 405 V 437"/>
<path d="M 195 510 V 552"/>
<path d="M 195 635 V 672"/>
<path d="M 195 745 V 782"/>
<path d="M 370 480 H 415 V 595 H 432"/>
</g><g fill="none" stroke="#35566c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)">
<path d="M 435 150 H 373"/>
<path d="M 435 255 H 373"/>
<path d="M 435 475 H 373"/>
<path d="M 435 710 H 373"/>
