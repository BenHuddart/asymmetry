<text x="240.0" y="1011.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">Grouped MaxEnt</text>
<text x="240.0" y="1043.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#163449">1/σ² starting level</text>
