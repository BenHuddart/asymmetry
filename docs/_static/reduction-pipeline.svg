<text x="195.0" y="463.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">Apply enabled group</text>
<text x="195.0" y="487.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#163449">background correction</text>
