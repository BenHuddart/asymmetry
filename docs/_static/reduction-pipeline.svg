<text x="557.5" y="636.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#163449">with α / β balances</text>
<rect x="435" y="675" width="245" height="70" rx="8" fill="#f3eef9" stroke="#35566c" stroke-width="1.5"/>
<text x="557.5" y="698.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#163449">Resolve α / β policies</text>
