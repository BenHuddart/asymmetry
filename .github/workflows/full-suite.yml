name: Full test suite

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - standard
          - fast

permissions:
  contents: read

jobs:
  full-suite:
    name: Full test suite (${{ inputs.tier || 'full' }} tier, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: >-
          ${{ fromJSON((inputs.tier == 'fast' || inputs.tier == 'standard')
          && '["1/1"]' || '["1/6","2/6","3/6","4/6","5/6","6/6"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[gui,gle,hdf5,root,dev]"

      - name: Record memory counters
        run: |
          awk '$1 == "oom_kill" { print }' /proc/vmstat
          free -h

      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
          TEST_TIER: ${{ inputs.tier || 'full' }}
          TEST_SHARD: ${{ matrix.shard }}
        run: >-
          python tools/harness.py test --tier="$TEST_TIER" --shard="$TEST_SHARD" --
          -vv --durations=20 --max-worker-restart=0 -o faulthandler_timeout=600

      - name: Report memory counters
        if: always()
        run: |
          awk '$1 == "oom_kill" { print }' /proc/vmstat
          free -h
