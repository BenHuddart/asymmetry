name: Docs Build and Deploy

on:
  # Releases dispatch this workflow at their tag after PyPI and GitHub publication.
  # Main updates also deploy; availability-qualified install instructions remain
  # accurate before a version is published on PyPI.
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/harness.py"
      - "tools/docs_*.py"
      - "tests/tools/test_docs*.py"
      - "tests/tools/test_harness*.py"
      - "tests/tools/test_release_workflows.py"
      - "src/**"
      - "constraints.txt"
      - "pyproject.toml"
      - ".github/workflows/docs-pages.yml"
  # On pull requests we run a cheap build-only smoke (no screenshots, no deploy)
  # so a Sphinx-breaking docs change is still caught before merge. Scoped to
  # docs-affecting paths, including source because autodoc parses its docstrings.
  pull_request:
    paths:
      - "docs/**"
      - "tools/harness.py"
      - "tools/docs_*.py"
      - "tests/tools/test_docs*.py"
      - "tests/tools/test_harness*.py"
      - "tests/tools/test_release_workflows.py"
      - "src/**"
      - "constraints.txt"
      - "pyproject.toml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# Least privilege at the top level: the cheap PR smoke and the release build only
# read the repo. The Pages write / id-token / artifact-delete permissions are
# granted narrowly to the deploy job below, so PR-triggered code never holds them.
permissions:
  contents: read

# Per-ref build concurrency: a superseded build for the same ref (e.g. two quick
# merges to main, or a force-pushed PR) is cancelled rather than queued. The
# deploy job additionally serializes under the shared `pages` group below, per
# GitHub's recommended pattern, so an in-flight Pages deploy is never cancelled.
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap PR gate: confirm the docs still build. No screenshot capture (the slow,
  # offscreen-Qt part) and no Pages artifact/deploy — the shared source documentation gate.
  docs-smoke:
    name: Docs build smoke (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .
          pip install -c constraints.txt -r docs/requirements.txt

      - name: Install Qt import runtime libraries
        # Autodoc imports GUI classes without starting a QApplication.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libdbus-1-3

      - name: Check screenshot references
        # Static consistency gate: every `/_generated/screenshots/<name>.png`
        # referenced from the .rst sources must map to a registered scenario,
        # and every scenario must be referenced somewhere (an unused scenario
        # still costs capture time on every full build).
        run: python -m docs.screenshots.capture --check-refs

      - name: Write corpus screenshot stubs
        # The PR smoke never has the muon-school corpus; labelled placeholder
        # PNGs stand in for the corpus-driven renders so pages that embed them
        # build image-complete (PIL only — no Qt, no corpus, seconds).
        run: python -m docs.screenshots.capture_corpus --stubs-missing

      - name: Build HTML docs (no screenshots)
        # Source mode permits only registered optional image omissions and uses
        # no remote inventories; all remaining Sphinx warnings fail the gate.
        run: python3 tools/harness.py docs --mode source

  # Full build: regenerate GUI screenshots, build HTML, and (below) deploy to
  # Pages. Runs on a docs-affecting push to main or a manual dispatch, including
  # the release workflow dispatch at its published tag.
  build-docs:
    name: Build Sphinx docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Outer guard: the in-process screenshot watchdog (faulthandler, 10 min per
    # capture process) and the step timeouts below should all fire first; this
    # bounds the whole job in case anything upstream/downstream wedges too.
    # Corpus capture runs one process per scenario module, so no single process
    # approaches the watchdog even though the whole sweep takes tens of minutes.
    timeout-minutes: 75
    env:
      CORPUS_VERSION: "2026.07.16"
      CORPUS_SHA256: "3d6a3dff8ab2dea9782d84c1ceb284b28a394fa1fab614d1aa97bce7f7f25afe"
      CORPUS_REPO: "BenHuddart/wimda-muon-school-corpus"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation dependencies
        # HDF4/HDF5 supply corpus loaders; ROOT supplies the synthetic legacy
        # calibration capture through its production loader.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[hdf4,hdf5,root]"
          pip install -c constraints.txt -r docs/requirements.txt

      - name: Install offscreen-Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core zstd

      - name: Download muon-school corpus
        # Base-branch Actions caches are readable by PR workflows. Keep the
        # private release asset and extracted data in this runner's temp directory.
        env:
          GH_TOKEN: ${{ secrets.CORPUS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CORPUS_REPO_TOKEN is required for Pages publication"
            exit 1
          fi
          archive="wimda-corpus-${CORPUS_VERSION}.tar.zst"
          download_dir=$(mktemp -d "$RUNNER_TEMP/wimda-download.XXXXXX")
          trap 'rm -rf -- "$download_dir"' EXIT
          gh release download "v${CORPUS_VERSION}" \
            --repo "$CORPUS_REPO" \
            --pattern "$archive" \
            --dir "$download_dir"
          printf '%s  %s\n' "$CORPUS_SHA256" "$download_dir/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/wimda-corpus"
          tar --use-compress-program=unzstd \
            -xf "$download_dir/$archive" \
            -C "$RUNNER_TEMP/wimda-corpus" --strip-components=1

      - name: Generate GUI screenshots
        continue-on-error: true
        # Backstop for the in-process faulthandler watchdog: if a fit holds the
        # GIL so hard that even faulthandler cannot fire, GitHub kills the step.
        # continue-on-error keeps the docs build going with whatever was captured.
        timeout-minutes: 12
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m docs.screenshots.capture --out docs/_generated/screenshots

      - name: Generate corpus screenshots
        # Each module gets its own watchdog. The Pages gate checks every
        # referenced PNG and receipt after the remaining modules have run.
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export ASYMMETRY_CORPUS_ROOT="$RUNNER_TEMP/wimda-corpus"
          if [ ! -d "$ASYMMETRY_CORPUS_ROOT/Basics" ]; then
            echo "::error::The pinned corpus snapshot was not extracted"
            exit 1
          fi
          modules=$(python -m docs.screenshots.capture_corpus --list-modules --published)
          for module in $modules; do
            echo "::group::corpus module ${module}"
            if ! python -m docs.screenshots.capture_corpus --module "$module" --published; then
              echo "::warning::corpus module ${module} failed"
            fi
            echo "::endgroup::"
          done

      - name: Verify GUI screenshot completeness
        # Capture steps tolerate individual failures. Ordinary GUI assets must
        # be complete before building or uploading. The Pages gate repeats
        # this ordinary asset check and validates referenced corpus captures.
        run: |
          if ! OUTPUT=$(python -m docs.screenshots.capture --check-complete --out docs/_generated/screenshots 2>&1); then
            echo "$OUTPUT"
            echo "$OUTPUT" | grep '^- missing screenshot: ' | \
              sed -E 's/^- missing screenshot: (.+)$/::error::missing GUI screenshot: \1/'
            exit 1
          fi
          echo "$OUTPUT"

      - name: Build HTML docs
        run: python3 tools/harness.py docs --mode pages

      - name: Disable Jekyll processing
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          retention-days: 3

  deploy-pages:
    name: Deploy to GitHub Pages
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: build-docs
    # Deploy main updates and deliberate dispatches, including published release
    # tags. PR events cannot reach here because build-docs is skipped for them.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    # One Pages deploy at a time, never cancelled mid-flight (GitHub's
    # recommended `pages` group): a tag deploy and a main deploy queue behind
    # each other instead of racing or interrupting one another.
    concurrency:
      group: pages
      cancel-in-progress: false
    # The Pages deploy is the only job that needs write scopes: pages/id-token to
    # publish, and actions:write to delete the consumed artifact afterwards.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      # The Pages deploy has consumed the artifact; delete it so it does not sit
      # in the run's storage. Failed/cancelled attempts retain it for recovery.
      - name: Delete github-pages artifact
        if: success() && steps.deployment.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId },
            );
            for (const artifact of artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted artifact ${artifact.name} (id ${artifact.id})`);
              }
            }
