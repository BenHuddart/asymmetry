name: Build and Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail fast if the tag disagrees with the tree it points at, before paying
  # for the platform builds: the tag version must match pyproject.toml (the
  # single source of truth that importlib.metadata reports at runtime), and a
  # stable release must have a rolled CHANGELOG heading. Prerelease tags
  # (containing "-") skip the changelog requirement.
  verify-version:
    name: Verify version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python: ${{ steps.native-tools.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check version against tag and CHANGELOG.md
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}."
            exit 1
          fi
          case "${VERSION}" in
            *-*) echo "Prerelease tag; skipping changelog check." ;;
            *)
              if ! grep -q "^## \[${VERSION}\] " CHANGELOG.md; then
                echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading -" \
                  "the [Unreleased] section was not rolled for this release."
                exit 1
              fi
              ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Read native acceptance interpreter
        id: native-tools
        shell: bash
        run: python3 -c "import json,os; t=json.load(open('packaging/release/tools.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); print('python='+t['python'],file=f)"

  build-macos-arm:
    name: Build macOS DMG (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    needs: verify-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Replay reviewed build dependencies
        uses: ./.github/actions/release-environment
        with:
          target: macos-arm64

      - name: Generate macOS icon (.icns)
        shell: bash
        run: python tools/branding.py --platform macos

      - name: Prepare packaged build identity
        shell: bash
        run: python -I tools/release_artifacts.py prepare --target macos-arm64 --commit "$GITHUB_SHA" --replay "$RUNNER_TEMP/release-replay"

      - name: Prepare bounded native scientific inputs
        shell: bash
        run: python -I tools/native_acceptance.py prepare --target macos-arm64 --commit "$GITHUB_SHA" --packet "$RUNNER_TEMP/release-science-inputs-macos-arm64"

      - name: Build application with PyInstaller
        env:
          PYI_ICON_PATH: ${{ github.workspace }}/build/icons/Asymmetry.icns
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/asymmetry.spec

      - name: Inventory actual bundle and notices
        shell: bash
        run: python -I tools/release_artifacts.py collect --target macos-arm64 --commit "$GITHUB_SHA" --bundle dist/Asymmetry.app

      - name: Smoke-test packaged app
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -I "$GITHUB_WORKSPACE/tools/release_environment.py" --smoke "$GITHUB_WORKSPACE/dist/Asymmetry.app/Contents/MacOS/Asymmetry" --smoke-test --smoke-test-root

      - name: Generate DMG background
        shell: bash
        run: python scripts/build_dmg_background.py --output build/dmg-bg.png

      - name: Build DMG
        env:
          ASYMMETRY_APP_BUNDLE: ${{ github.workspace }}/dist/Asymmetry.app
          ASYMMETRY_DMG_BACKGROUND: ${{ github.workspace }}/build/dmg-bg.png
        shell: bash
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          DMG_PATH="dist/Asymmetry-${VERSION}-macos-arm64.dmg"

          test -d dist/Asymmetry.app

          rm -f "$DMG_PATH"
          dmgbuild -s packaging/macos/dmg_settings.py "Asymmetry" "$DMG_PATH"

      - name: Record final artifact bytes
        shell: bash
        run: python -I tools/release_artifacts.py finalize --target macos-arm64 --commit "$GITHUB_SHA" --bundle dist/Asymmetry.app --artifact "dist/Asymmetry-${{ needs.verify-version.outputs.version }}-macos-arm64.dmg" --label "${{ needs.verify-version.outputs.version }}"

      - name: Retain native scientific inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-science-inputs-macos-arm64
          path: ${{ runner.temp }}/release-science-inputs-macos-arm64
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: asymmetry-macos-arm64
          path: |
            dist/Asymmetry-${{ needs.verify-version.outputs.version }}-macos-arm64.dmg
            dist/macos-arm64-build-components.json
            dist/macos-arm64-artifact.json
            dist/macos-arm64-SHA256SUMS
          if-no-files-found: error
          # Build artifacts are only needed long enough for the release job to
          # download them; the "Delete workflow artifacts" step removes them on
          # success, and this caps lingering ones (e.g. if a build succeeds but
          # the release job never runs) instead of the 90-day default.
          retention-days: 1

      - name: Retain macos-arm64 replay observations
        uses: actions/upload-artifact@v7
        with:
          name: release-replay-macos-arm64
          path: ${{ runner.temp }}/release-replay/replay-*/observed.json
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows installer (x64)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: verify-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Replay reviewed build dependencies
        uses: ./.github/actions/release-environment
        with:
          target: windows-x64

      - name: Generate Windows icon (.ico)
        shell: pwsh
        run: |
          python tools/branding.py --platform windows

      - name: Stage HDF4 runtime DLLs
        shell: pwsh
        run: python packaging/windows/fetch_hdf4_dlls.py "$env:GITHUB_WORKSPACE\build\hdf4-dlls"

      - name: Prepare packaged build identity
        shell: bash
        run: python -I tools/release_artifacts.py prepare --target windows-x64 --commit "$GITHUB_SHA" --replay "$RUNNER_TEMP/release-replay"

      - name: Prepare bounded native scientific inputs
        env:
          ASYMMETRY_HDF4_DLL_DIR: ${{ github.workspace }}/build/hdf4-dlls
        shell: bash
        run: python -I tools/native_acceptance.py prepare --target windows-x64 --commit "$GITHUB_SHA" --packet "$RUNNER_TEMP/release-science-inputs-windows-x64"

      - name: Build application with PyInstaller
        env:
          PYI_ICON_PATH: ${{ github.workspace }}\build\icons\Asymmetry.ico
          ASYMMETRY_HDF4_DLL_DIR: ${{ github.workspace }}\build\hdf4-dlls
        shell: pwsh
        run: pyinstaller --clean --noconfirm packaging/asymmetry.spec

      - name: Inventory actual bundle and notices
        shell: bash
        run: python -I tools/release_artifacts.py collect --target windows-x64 --commit "$GITHUB_SHA" --bundle dist/Asymmetry

      - name: Smoke-test packaged app
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -I "$GITHUB_WORKSPACE/tools/release_environment.py" --smoke "$GITHUB_WORKSPACE/dist/Asymmetry/Asymmetry.exe" --smoke-test --smoke-test-root

      - name: Build EXE installer
        shell: pwsh
        run: |
          $version = "${{ needs.verify-version.outputs.version }}"
          $appDir = "$env:GITHUB_WORKSPACE\dist\Asymmetry"
          $iconFile = "$env:GITHUB_WORKSPACE\build\icons\Asymmetry.ico"
          $outputDir = "$env:GITHUB_WORKSPACE\dist"
          python tools/release_environment.py --inno `
            "/DAppVersion=$version" `
            "/DAppDir=$appDir" `
            "/DIconFile=$iconFile" `
            "/DOutputDir=$outputDir" `
            packaging\windows\asymmetry.iss

      - name: Record final artifact bytes
        shell: bash
        run: python -I tools/release_artifacts.py finalize --target windows-x64 --commit "$GITHUB_SHA" --bundle dist/Asymmetry --artifact "dist/Asymmetry-${{ needs.verify-version.outputs.version }}-windows-x64-setup.exe" --label "${{ needs.verify-version.outputs.version }}"

      - name: Retain native scientific inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-science-inputs-windows-x64
          path: ${{ runner.temp }}/release-science-inputs-windows-x64
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: asymmetry-windows-x64
          path: |
            dist/Asymmetry-${{ needs.verify-version.outputs.version }}-windows-x64-setup.exe
            dist/windows-x64-build-components.json
            dist/windows-x64-artifact.json
            dist/windows-x64-SHA256SUMS
          if-no-files-found: error
          # Build artifacts are only needed long enough for the release job to
          # download them; the "Delete workflow artifacts" step removes them on
          # success, and this caps lingering ones (e.g. if a build succeeds but
          # the release job never runs) instead of the 90-day default.
          retention-days: 1

      - name: Retain windows-x64 replay observations
        uses: actions/upload-artifact@v7
        with:
          name: release-replay-windows-x64
          path: |
            ${{ runner.temp }}/release-replay/replay-*/observed.json
            build/inno-observed.json
          if-no-files-found: error
          retention-days: 1

  validate:
    uses: ./.github/workflows/full-suite.yml

  verify-artifacts:
    name: Verify downloaded native artifacts
    runs-on: ubuntu-latest
    needs: [verify-version, build-macos-arm, build-windows]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: asymmetry-*
          path: ${{ runner.temp }}/release-assets

      - name: Download bounded native scientific inputs
        uses: actions/download-artifact@v8
        with:
          pattern: release-science-inputs-*
          path: ${{ runner.temp }}/release-science-inputs

      - name: Verify downloaded publication assets
        shell: bash
        run: |
          for target in macos-arm64 windows-x64; do
            python3 -I tools/release_artifacts.py verify --target "$target" --commit "$GITHUB_SHA" --directory "$RUNNER_TEMP/release-assets/asymmetry-$target"
            python3 -I tools/native_acceptance.py verify --target "$target" --commit "$GITHUB_SHA" --packet "$RUNNER_TEMP/release-science-inputs/release-science-inputs-$target"
          done

  accept-native:
    name: Scientific acceptance (${{ matrix.target }})
    needs: [verify-version, verify-artifacts]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            architecture: x64
          - target: macos-arm64
            os: macos-15
            architecture: arm64
    steps:
      - name: Set up reviewed native driver interpreter
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.verify-version.outputs.python }}
          architecture: ${{ matrix.architecture }}
      - name: Download delivered native artifact
        uses: actions/download-artifact@v8
        with:
          name: asymmetry-${{ matrix.target }}
          path: ${{ runner.temp }}/native-artifacts
      - name: Download source-verified scientific inputs
        uses: actions/download-artifact@v8
        with:
          name: release-science-inputs-${{ matrix.target }}
          path: ${{ runner.temp }}/native-science-inputs
      - name: Execute delivered scientific journey and actual omissions
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m venv --without-pip "$RUNNER_TEMP/native-driver"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SCIENCE_PYTHON="$RUNNER_TEMP/native-driver/Scripts/python.exe"
          else
            SCIENCE_PYTHON="$RUNNER_TEMP/native-driver/bin/python"
          fi
          "$SCIENCE_PYTHON" -I -B "$RUNNER_TEMP/native-science-inputs/native_acceptance.py" run --packet "$RUNNER_TEMP/native-science-inputs" --directory "$RUNNER_TEMP/native-artifacts" --target "${{ matrix.target }}" --commit "$GITHUB_SHA" --version "${{ needs.verify-version.outputs.version }}" --output "$RUNNER_TEMP/native-science-result.json"
      - name: Retain native scientific report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-science-results-${{ matrix.target }}
          path: ${{ runner.temp }}/native-science-result.json
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push'
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - validate
      - build-macos-arm
      - build-windows
      - verify-artifacts
      - accept-native
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: asymmetry-*
          path: ${{ runner.temp }}/release-assets

      - name: Verify downloaded publication assets
        shell: bash
        run: |
          for target in macos-arm64 windows-x64; do
            python3 -I tools/release_artifacts.py verify --target "$target" --commit "$GITHUB_SHA" --directory "$RUNNER_TEMP/release-assets/asymmetry-$target"
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ runner.temp }}/release-assets/asymmetry-macos-arm64/Asymmetry-${{ needs.verify-version.outputs.version }}-macos-arm64.dmg
            ${{ runner.temp }}/release-assets/asymmetry-windows-x64/Asymmetry-${{ needs.verify-version.outputs.version }}-windows-x64-setup.exe
            ${{ runner.temp }}/release-assets/asymmetry-macos-arm64/macos-arm64-build-components.json
            ${{ runner.temp }}/release-assets/asymmetry-macos-arm64/macos-arm64-artifact.json
            ${{ runner.temp }}/release-assets/asymmetry-macos-arm64/macos-arm64-SHA256SUMS
            ${{ runner.temp }}/release-assets/asymmetry-windows-x64/windows-x64-build-components.json
            ${{ runner.temp }}/release-assets/asymmetry-windows-x64/windows-x64-artifact.json
            ${{ runner.temp }}/release-assets/asymmetry-windows-x64/windows-x64-SHA256SUMS

      - name: Delete workflow artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id,
                per_page: 100,
              },
            );

            for (const artifact of artifacts) {
              core.info(`Deleting artifact ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }
