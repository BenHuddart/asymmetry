name: Preview build (Windows x64)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: preview-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer (x64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract preview version
        id: meta
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "' | Select-Object -First 1
          $baseVersion = $line.Line -replace '^version = "(.+)"', '$1'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $previewVersion = "$baseVersion-preview.$shortSha"
          "version=$previewVersion" >> $env:GITHUB_OUTPUT

      - name: Replay reviewed build dependencies
        uses: ./.github/actions/release-environment
        with:
          target: windows-x64

      - name: Generate Windows icon (.ico)
        shell: pwsh
        run: |
          python tools/branding.py --platform windows

      - name: Stage HDF4 runtime DLLs
        shell: pwsh
        run: python packaging/windows/fetch_hdf4_dlls.py "$env:GITHUB_WORKSPACE\build\hdf4-dlls"

      - name: Prepare packaged build identity
        shell: bash
        run: python -I tools/release_artifacts.py prepare --target windows-x64 --commit "$GITHUB_SHA" --replay "$RUNNER_TEMP/release-replay"

      - name: Build application with PyInstaller
        env:
          PYI_ICON_PATH: ${{ github.workspace }}\build\icons\Asymmetry.ico
          ASYMMETRY_HDF4_DLL_DIR: ${{ github.workspace }}\build\hdf4-dlls
        shell: pwsh
        run: pyinstaller --clean --noconfirm packaging/asymmetry.spec

      - name: Inventory actual bundle and notices
        shell: bash
        run: python -I tools/release_artifacts.py collect --target windows-x64 --commit "$GITHUB_SHA" --bundle dist/Asymmetry

      - name: Smoke-test packaged app
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -I "$GITHUB_WORKSPACE/tools/release_environment.py" --smoke "$GITHUB_WORKSPACE/dist/Asymmetry/Asymmetry.exe" --smoke-test --smoke-test-root

      - name: Build EXE installer
        shell: pwsh
        run: |
          $previewVersion = "${{ steps.meta.outputs.version }}"
          $appDir = "$env:GITHUB_WORKSPACE\dist\Asymmetry"
          $iconFile = "$env:GITHUB_WORKSPACE\build\icons\Asymmetry.ico"
          $outputDir = "$env:GITHUB_WORKSPACE\dist"
          $outputName = "Asymmetry-$previewVersion-windows-x64-setup"
          python tools/release_environment.py --inno `
            "/DAppVersion=$previewVersion" `
            "/DAppDir=$appDir" `
            "/DIconFile=$iconFile" `
            "/DOutputDir=$outputDir" `
            "/DOutputName=$outputName" `
            packaging\windows\asymmetry.iss

      - name: Record final artifact bytes
        shell: bash
        run: python -I tools/release_artifacts.py finalize --target windows-x64 --commit "$GITHUB_SHA" --bundle dist/Asymmetry --artifact "dist/Asymmetry-${{ steps.meta.outputs.version }}-windows-x64-setup.exe" --label "${{ steps.meta.outputs.version }}"

      - name: Upload Windows preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: asymmetry-windows-x64-preview
          path: |
            dist/Asymmetry-${{ steps.meta.outputs.version }}-windows-x64-setup.exe
            dist/windows-x64-build-components.json
            dist/windows-x64-artifact.json
            dist/windows-x64-SHA256SUMS
          if-no-files-found: error
          # Preview builds are downloaded manually from the workflow run; a short
          # retention keeps Actions storage use low (default is 90 days).
          retention-days: 3

      - name: Retain replay observations
        uses: actions/upload-artifact@v7
        with:
          name: release-replay-windows-x64
          path: |
            ${{ runner.temp }}/release-replay/replay-*/observed.json
            build/inno-observed.json
          if-no-files-found: error
          retention-days: 3
