name: CI

on:
  # Run on PRs (covers every feature/topic branch), and on pushes to main
  # (post-merge validation). Avoids the duplicate run that occurred when both
  # push:"**" and pull_request:"**" fired for the same PR branch.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter lists changed files via the PR API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether anything that affects tests changed, so docs-only / metadata
  # PRs can skip the (slow) test matrix while still satisfying the required
  # "CI success" gate below.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'constraints.txt'
              - '.github/workflows/ci.yml'

  # Fast lint + structural checks. Always run (cheap, and structural validates
  # repo shape such as the porting policy index, which docs changes can touch).
  checks:
    name: Lint & structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: uv pip install -c constraints.txt -e ".[dev]"
      - name: Structural checks
        run: python tools/harness.py structural
      - name: Lint
        run: python tools/harness.py lint

  # Standard-tier suite, split across six parallel runners by a stable hash of
  # each test's node id (the harness `--shard K/N`), so the shards are disjoint
  # and together cover exactly the standard tier. Each shard mixes GUI and
  # non-GUI tests and runs `-n auto --dist worksteal` within its runner. Every
  # shard pays a fixed ~1.5 min of setup and collection, so more shards trade
  # (free, public-repo) runner time for wall-clock; keep the matrix and the
  # `/6` in step. See docs/HARNESS.md#test-tiers.
  test:
    name: Tests (shard ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A rare intermittent GUI-test deadlock (native Qt/iminuit C++ block holding
    # the GIL) can wedge a shard indefinitely because the thread-method
    # pytest-timeout cannot interrupt it. Cap the job so a hung shard is killed
    # and can be rerun rather than sitting until the ~6h GitHub default. The
    # faulthandler watchdog below (armed via ASYMMETRY_FAULTHANDLER_TIMEOUT) dumps
    # the wedged stack to the logs before this cap fires, so the cap frees the
    # runner while the diagnostic is still captured.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: |
          # libegl1 (Qt offscreen) installs in the background while uv installs
          # the Python dependencies; the step fails if either does.
          (sudo apt-get update -q && sudo apt-get install -y -q libegl1) &
          apt_pid=$!
          # gle: gleplot (tag-pinned) so the GLE export orchestrator and the
          # in-app figure-editor integration run for real in CI instead of
          # skipping via their importorskip / feature-detection guards.
          uv pip install -c constraints.txt -e ".[gui,gle,hdf5,root,dev]"
          wait "$apt_pid"
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
          # Native-thread hang watchdog (see tests/conftest.py). Dumps every
          # thread's stack every 600s so a wedged shard's culprit stack lands in
          # the logs before the 20-min job cap kills the runner. 600s is above the
          # healthy shard runtime (~4 min on a 4-vCPU runner) so a passing run
          # never dumps, and below timeout-minutes so a hang always does.
          ASYMMETRY_FAULTHANDLER_TIMEOUT: "600"
        run: python tools/harness.py test --tier standard --shard ${{ matrix.shard }}/6 -- --durations=15

  # Single required status check that aggregates the checks + test jobs, so the
  # branch ruleset only needs to require this one status. Passes when checks
  # succeeded and tests succeeded (or were skipped for a non-code change).
  ci-success:
    name: CI success
    if: always()
    needs: [changes, checks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "checks:  ${{ needs.checks.result }}"
          echo "test:    ${{ needs.test.result }}"
          # changes must succeed, otherwise 'test' may have been skipped due to an
          # infrastructure failure rather than a legitimate no-code-change PR.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection failed"
            exit 1
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::error::Lint & structural checks failed"
            exit 1
          fi
          # 'skipped' is only legitimate here because change detection succeeded
          # and reported no code changes.
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "::error::Test suite failed"
            exit 1
          fi
          echo "All required CI jobs passed (tests skipped only for non-code changes)."
