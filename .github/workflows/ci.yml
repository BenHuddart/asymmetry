name: CI

on:
  # Run on PRs (covers every feature/topic branch), and on pushes to main
  # (post-merge validation). Avoids the duplicate run that occurred when both
  # push:"**" and pull_request:"**" fired for the same PR branch.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      structural_base:
        description: Immutable 40-character comparison commit SHA
        required: true
        type: string

permissions:
  contents: read
  # dorny/paths-filter lists changed files via the PR API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether anything that affects tests changed, so docs-only / metadata
  # PRs can skip the (slow) test matrix while still satisfying the required
  # "CI success" gate below.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'packaging/**'
              - '.github/actions/**'
              - 'docs/conf.py'
              - 'docs/_ext/**'
              - 'docs/screenshots/**'
              - 'pyproject.toml'
              - 'constraints.txt'
              - '.github/workflows/**'

  # Fast lint + structural checks. Always run (cheap, and structural validates
  # repo shape such as the retired-docs baseline, which docs changes can touch).
  checks:
    name: Lint & structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch structural event base
        run: |
          base=$(python3 tools/harness_maintenance.py)
          git fetch --no-tags origin "$base"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: uv pip install -c constraints.txt -e ".[dev]"
      - name: Structural checks
        run: python3 tools/harness.py structural --ci
      - name: Lint
        run: python tools/harness.py lint

  # Standard-tier suite, split across six parallel runners by a stable hash of
  # each test's node id (the harness `--shard K/N`), so the shards are disjoint
  # and together cover exactly the standard tier. Each shard mixes GUI and
  # non-GUI tests and runs `-n auto --dist worksteal` within its runner. Every
  # shard pays a fixed ~1.5 min of setup and collection, so more shards trade
  # (free, public-repo) runner time for wall-clock; keep the matrix and the
  # `/6` in step. See docs/HARNESS.md#test-tiers.
  test:
    name: Tests (shard ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Native per-test dumps identify stalled tests before the job deadline.
    # The job cap also bounds collection and worker-communication hangs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: |
          # libegl1 (Qt offscreen) installs in the background while uv installs
          # the Python dependencies; the step fails if either does.
          (sudo apt-get update -q && sudo apt-get install -y -q libegl1) &
          apt_pid=$!
          # gle: gleplot (PyPI-pinned) so the GLE export orchestrator and the
          # vector-preview generation run for real in CI instead of
          # skipping via their importorskip guards.
          uv pip install -c constraints.txt -e ".[gui,gle,hdf5,root,dev]"
          wait "$apt_pid"
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
          ASYMMETRY_PYTEST_DIAGNOSTICS: ${{ runner.temp }}/pytest-diagnostics
        run: |
          set -o pipefail
          mkdir -p "$ASYMMETRY_PYTEST_DIAGNOSTICS"
          python tools/ci_memory.py before "$ASYMMETRY_PYTEST_DIAGNOSTICS"
          trap 'python tools/ci_memory.py after "$ASYMMETRY_PYTEST_DIAGNOSTICS"' EXIT
          python tools/harness.py test --tier standard --shard ${{ matrix.shard }}/6 -- --durations=15 -o faulthandler_timeout=90 2>&1 | tee "$ASYMMETRY_PYTEST_DIAGNOSTICS/runner.log"
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # Always run: README/license/package-data changes can alter a distribution even
  # when the editable test selection reports no code change.
  install-smoke:
    name: Wheel installs (Python ${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        resolution: [constrained, unconstrained]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install outer build tooling
        run: uv pip install build pip
      - name: Install GUI runtime
        run: sudo apt-get update -q && sudo apt-get install -y libegl1
      - name: Build via sdist and probe fresh installs
        run: >-
          python3 tools/distribution_smoke.py --output "$RUNNER_TEMP/distribution-smoke"
          --profile core --profile gui --profile agent --profile all
          --resolution ${{ matrix.resolution }}
      - name: Retain distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-installs-${{ matrix.python }}-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/distribution-smoke/**/*.log
            ${{ runner.temp }}/distribution-smoke/manifest.json
          retention-days: 7

  # Single required status check that aggregates the checks + test jobs, so the
  # branch ruleset only needs to require this one status. Passes when checks
  # succeeded and tests succeeded (or were skipped for a non-code change).
  ci-success:
    name: CI success
    if: always()
    needs: [changes, checks, test, install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "checks:  ${{ needs.checks.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "install-smoke: ${{ needs.install-smoke.result }}"
          if [ "${{ needs.install-smoke.result }}" != "success" ]; then
            echo "::error::Wheel installation smoke failed"
            exit 1
          fi
          # changes must succeed, otherwise 'test' may have been skipped due to an
          # infrastructure failure rather than a legitimate no-code-change PR.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection failed"
            exit 1
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::error::Lint & structural checks failed"
            exit 1
          fi
          # 'skipped' is only legitimate here because change detection succeeded
          # and reported no code changes.
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "::error::Test suite failed"
            exit 1
          fi
          echo "All required CI jobs passed (tests skipped only for non-code changes)."
