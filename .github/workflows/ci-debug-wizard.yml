name: CI debug (temporary) — wizard result flake
on:
  push:
    branches: [fix/wizard-result-scenario-determinism]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .
      - run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          python -c "import numpy._core._multiarray_umath as m; print('NUMPY_FEATURES', sorted(k for k, v in m.__cpu_features__.items() if v))"
      - name: new fields (0,5,10,25)
        run: python tools/_ci_debug/wizard_result_repro.py | grep -E "RANK|RESULT"
      - name: old fields (0,15,50,100), native dispatch
        run: PROBE_FIELDS=0,15,50,100 python tools/_ci_debug/wizard_result_repro.py | grep -E "RESULT"
      - name: old fields (0,15,50,100), AVX-512 dispatch disabled
        run: |
          OFF=$(python -c "import numpy._core._multiarray_umath as m; print(' '.join(k for k, v in m.__cpu_features__.items() if v and k.startswith('AVX512')))")
          echo "disabling: $OFF"
          if [ -n "$OFF" ]; then export NPY_DISABLE_CPU_FEATURES="$OFF"; fi
          PROBE_FIELDS=0,15,50,100 python tools/_ci_debug/wizard_result_repro.py | grep -E "RESULT"
